<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073d69">
  <meta name="description" content="EXPO Kumon — apresentação interativa e jogo de conhecimento em família.">
  <title>EXPO Kumon • Cada avanço merece ser celebrado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" aria-live="polite">
    <main style="min-height:100vh;display:grid;place-content:center;text-align:center;background:#eef7fc;color:#09243e;font:600 18px system-ui,sans-serif;padding:24px">
      <h1 style="font-size:30px">EXPO KUMON</h1>
      <p>Carregando a apresentação...</p>
      <p style="font-size:13px;color:#42617a">Se a tela não abrir, atualize a página.</p>
    </main>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
  <script defer src="firebase-config.js"></script>
  <script defer src="homenageados.js"></script>
  <script>
    // Evita uma tela branca quando o script principal falha no navegador.
    window.addEventListener('error',function(e){
      const fn=String(e.filename||e.target?.src||'');
      if(!fn.includes('app.js'))return;
      const root=document.getElementById('app');
      if(!root || root.querySelector('.shell'))return;
      root.innerHTML='<main style="min-height:100vh;display:grid;place-content:center;text-align:center;background:#eef7fc;color:#09243e;font:600 18px system-ui,sans-serif;padding:24px"><h1>Não foi possível carregar a EXPO.</h1><p>Atualize esta página. Se o problema continuar, informe o organizador.</p><a style="color:#006db5" href="/">Voltar ao início</a></main>';
    },true);
  </script>
  <script defer src="app.js"></script>
</body>
</html>
